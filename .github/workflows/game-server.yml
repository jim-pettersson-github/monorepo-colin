name: Game server (games.charliecare.se)

# Dokploy on the home dev host builds and runs the server (game-server/README.md). This checks that the
# image builds, and that the live server answers.
on:
  push:
    branches: [main]
    paths:
      - 'game-server/**'
      - '.github/workflows/game-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: https://games.charliecare.se
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the PHP syntax
        run: php -l game-server/public/api.php
      - name: Build the container image
        run: docker build --quiet --tag game-server game-server
      - name: Check the live server
        run: |
          curl --fail --silent --show-error --max-time 30 "$SITE/api.php?a=health" | tee "$RUNNER_TEMP/health.json"
          jq --exit-status '.ok == true and .relay == true' "$RUNNER_TEMP/health.json"
          curl --fail --silent --show-error --max-time 30 "$SITE/api.php?a=ice" | jq '.iceServers | map(.urls) | flatten'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "$SITE/games.sqlite")
          echo "games.sqlite answered $status"
          test "$status" = 403 -o "$status" = 404
