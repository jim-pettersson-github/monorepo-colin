name: Game checks and GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web-game-elevator-pwo-react-pixi-js/**'
      - 'web-game-alfred-lego-fc-pwa-react-three-js/**'
      - 'web-game-charlie-for-speed-pwa-react-three-js/**'
      - 'web-game-disney-track-and-field-pwa-react-canvas/**'
      - 'game-selector/**'
      - '.github/scripts/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web-game-elevator-pwo-react-pixi-js/**'
      - 'web-game-alfred-lego-fc-pwa-react-three-js/**'
      - 'web-game-charlie-for-speed-pwa-react-three-js/**'
      - 'web-game-disney-track-and-field-pwa-react-canvas/**'
      - 'game-selector/**'
      - '.github/scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-game-elevator-pwo-react-pixi-js
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/colin-elevator/
      # Room codes for online multiplayer; see game-server/.
      VITE_ROOM_SERVER: https://games.charliecare.se/api.php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web-game-elevator-pwo-react-pixi-js/package-lock.json
            web-game-alfred-lego-fc-pwa-react-three-js/package-lock.json
            web-game-charlie-for-speed-pwa-react-three-js/package-lock.json
            web-game-disney-track-and-field-pwa-react-canvas/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Install Alfred FC
        working-directory: web-game-alfred-lego-fc-pwa-react-three-js
        run: npm ci
      - name: Check Alfred FC
        working-directory: web-game-alfred-lego-fc-pwa-react-three-js
        run: npm run check
      - name: Build Alfred FC
        working-directory: web-game-alfred-lego-fc-pwa-react-three-js
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/alfred-fc/
        run: npm run build
      - name: Install Charlie for Speed
        working-directory: web-game-charlie-for-speed-pwa-react-three-js
        run: npm ci
      - name: Check Charlie for Speed
        working-directory: web-game-charlie-for-speed-pwa-react-three-js
        run: npm run check
      - name: Build Charlie for Speed
        working-directory: web-game-charlie-for-speed-pwa-react-three-js
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/charlie-fs/
        run: npm run build
      - name: Install Sagospelen
        working-directory: web-game-disney-track-and-field-pwa-react-canvas
        run: npm ci
      - name: Check Sagospelen
        working-directory: web-game-disney-track-and-field-pwa-react-canvas
        run: npm run check
      - name: Build Sagospelen
        working-directory: web-game-disney-track-and-field-pwa-react-canvas
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/sagospelen/
        run: npm run build
      - name: Check the game selector and hosting scripts
        working-directory: web-game-disney-track-and-field-pwa-react-canvas
        run: npm run check:hosting
      - name: Assemble the game selector and all four games
        working-directory: .
        run: node .github/scripts/assemble-pages.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: pages-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy the build
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
